# Builds Cave.app. On a v* tag, it goes into a draft Release: write what's
# new on GitHub, then publish it. The runtime has its own releases
# (wine-cx-<version>, runtime.yml), which Cave downloads by itself.
name: Release

on:
  push:
    tags: ["v*"]
  # Run by hand (Actions tab): builds the app without releasing it.
  workflow_dispatch:

permissions:
  contents: write # create the draft release

env:
  TAURI_CLI_VERSION: "2.12.2"

jobs:
  app:
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - name: Version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version=$(sed -n 's/^  "version": "\(.*\)",$/\1/p' ui/tauri.conf.json)
          [[ "v$version" == "$GITHUB_REF_NAME" ]] ||
            { echo "::error::tag $GITHUB_REF_NAME but ui/tauri.conf.json says $version"; exit 1; }

      - name: Rust target of the Steam shim
        run: rustup target add x86_64-pc-windows-msvc

      - name: Tests
        run: cargo test --workspace

      - name: Cave.app
        run: npx --yes "@tauri-apps/cli@$TAURI_CLI_VERSION" build

      - name: Archive
        run: |
          mkdir -p "$RUNNER_TEMP/out"
          ditto -c -k --keepParent target/release/bundle/macos/Cave.app "$RUNNER_TEMP/out/Cave.zip"
          cd "$RUNNER_TEMP/out"
          shasum -a 256 Cave.zip > Cave.zip.sha256

      - uses: actions/upload-artifact@v4
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        with:
          name: app
          path: ${{ runner.temp }}/out/
          retention-days: 7

      - name: Draft release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "## Install"
            echo
            echo "1. Install Rosetta 2, which runs Wine: \`softwareupdate --install-rosetta --agree-to-license\`."
            echo "2. Download **Cave.zip**, unzip it and move **Cave.app** to your Applications folder."
            echo "3. Open Cave. It is not signed by Apple: allow it in **System Settings → Privacy & Security → Open Anyway**."
            echo "4. Cave downloads its runtime by itself, from the latest \`wine-cx-…\` release. Offline, drop the runtime archive onto its window instead."
            echo
            echo "## What's new"
            echo
            echo "_To be written before publishing._"
            echo
            echo "## Checksum (SHA-256)"
            echo
            echo '```'
            cat "$RUNNER_TEMP"/out/*.sha256
            echo '```'
            echo
            echo "Cave is a personal, non-commercial project, not affiliated with CodeWeavers."
          } > "$RUNNER_TEMP/notes.md"
          gh release create "$GITHUB_REF_NAME" --draft --verify-tag \
            --title "Cave ${GITHUB_REF_NAME#v}" --notes-file "$RUNNER_TEMP/notes.md" "$RUNNER_TEMP"/out/*

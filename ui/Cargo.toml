[package]
name = "cave-ui"
version = "0.3.0"
edition = "2021"
description = "Graphical interface of cave (Tauri)"
license = "GPL-3.0-or-later"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
cave = { path = ".." }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"

# Dock icon outside a Cave.app (set_dock_icon); launched programs brought to
# the front (bring_to_front); interface language (app_language).
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSApplication", "NSResponder", "NSImage", "NSRunningApplication", "NSWorkspace", "libc"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSData", "NSArray", "NSURL", "NSString", "NSLocale"] }

[features]
# Serves the embedded front/ files (no development server).
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
